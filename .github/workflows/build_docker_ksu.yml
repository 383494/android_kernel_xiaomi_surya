name: Build Surya Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: KernelSU v0.9.5 & Docker Integration
      run: |
        # --- 1. 清理环境 (至关重要) ---
        # 确保源码是纯净的，撤销 setup.sh 可能留下的任何修改
        # 这一步能解决 "undefined symbol: ksu_input_hook"
        git checkout .
        make mrproper
        rm -rf out
        mkdir -p out

        # --- 2. 手动集成 KernelSU v0.9.5 (稳定版) ---
        rm -rf drivers/kernelsu
        # 使用 v0.9.5，这是最适合 Android 4.14 内核的版本
        git clone --depth=1 --branch v0.9.5 https://github.com/tiann/KernelSU ksu_temp
        
        # 部署代码
        mkdir -p drivers/kernelsu
        cp -r ksu_temp/kernel/* drivers/kernelsu/
        rm -rf ksu_temp

        # 手动注册驱动 (仅作为模块编译，不修改 fs/exec.c)
        echo "obj-y += kernelsu/" >> drivers/Makefile
        sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

        # 修复 v0.9.5 在 4.14 上唯一的编译报错 (MODULE_IMPORT_NS)
        sed -i '1i #include <linux/version.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 4, 0)\n#define MODULE_IMPORT_NS(ns)\n#endif' drivers/kernelsu/ksu.c

        # --- 3. 创建 Docker + KSU 配置文件 ---
        # 参考 daoudeddy 的配置清单，整合为 merge fragment
        cat <<EOF > docker_ksu.config
        # ==========================================
        # KernelSU (Kprobes 模式)
        # ==========================================
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_OVERLAY_FS=y

        # ==========================================
        # Docker 核心组件 (参考 daoudeddy)
        # ==========================================
        # 1. Namespaces (必须全开)
        CONFIG_NAMESPACES=y
        CONFIG_NET_NS=y
        CONFIG_PID_NS=y
        CONFIG_IPC_NS=y
        CONFIG_UTS_NS=y
        CONFIG_USER_NS=y
        
        # 2. 基础 IPC (Docker 运行的前提)
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_KEYS=y
        
        # 3. Cgroups (资源隔离)
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y
        CONFIG_MEMCG_SWAP=y
        CONFIG_BLK_CGROUP=y
        CONFIG_CGROUP_BPF=y

        # 4. 网络与 Netfilter (最容易 missing 的部分)
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_VETH=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_IP_NF_NAT=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NF_NAT=y
        CONFIG_NF_NAT_IPV4=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_TARGET_REJECT=y
        CONFIG_IP_VS=y
        
        # 5. 高级网络 (可选但建议)
        CONFIG_MACVLAN=y
        CONFIG_VXLAN=y
        CONFIG_IPVLAN=y
        
        # ==========================================
        # 关键修正
        # ==========================================
        # [Fix 1] 允许 Docker 容器访问外网 (Android 特有限制)
        # CONFIG_ANDROID_PARANOID_NETWORK is not set
        
        # [Fix 2] 禁用 LTO (KernelSU Kprobes 必须)
        # CONFIG_LTO_CLANG is not set
        # CONFIG_LTO_CLANG_THIN is not set
        EOF

        # --- 4. 合并配置 (Magic happens here) ---
        # 使用内核脚本自动处理依赖，将 surya_defconfig 和 docker_ksu.config 合并
        export ARCH=arm64
        scripts/kconfig/merge_config.sh -m -O out arch/arm64/configs/surya_defconfig docker_ksu.config

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 生成最终 .config
        make O=out LLVM=1 LLVM_IAS=1 olddefconfig
        
        # 验证关键配置是否生效 (如果这里输出为空，说明配置没进去)
        echo "=== Config Check ==="
        grep "CONFIG_KSU" out/.config
        grep "CONFIG_IPC_NS" out/.config
        grep "CONFIG_BRIDGE" out/.config
        echo "===================="

        # 编译
        make -j$(nproc --all) O=out \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LOCALVERSION="-Docker-KSU-Final" \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        cat <<EOF > AnyKernel3/anykernel.sh
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=Surya-Docker-KSU-v0.9.5
        do.devicecheck=0
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        BLOCK=auto;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        . tools/ak3-core.sh;

        split_boot;
        flash_boot;
        flash_dtbo;
        EOF
        
        cd AnyKernel3
        zip -r9 ../Surya-Docker-KSU.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-KSU
        path: Surya-Docker-KSU.zip
