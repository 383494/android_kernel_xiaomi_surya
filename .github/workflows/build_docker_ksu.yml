name: Build Surya Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential \
          zip curl zlib1g-dev libxml2-utils bzip2 squashfs-tools \
          pngcrush schedtool dpkg-dev liblz4-tool make optipng maven \
          libssl-dev pwgen bc python3 python-is-python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang && cd clang
        curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Kernel Config (Docker + KernelSU)
      run: |
        make mrproper
        mkdir -p out

        cat <<EOF > docker_ksu.config
        # --- Namespaces ---
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y

        # --- Cgroups ---
        CONFIG_CGROUPS=y
        CONFIG_MEMCG=y
        CONFIG_BLK_CGROUP=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CPUSETS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_BPF=y

        # --- Docker FS ---
        CONFIG_OVERLAY_FS=y
        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y

        # --- Netfilter ---
        CONFIG_NETFILTER=y
        CONFIG_IP_NF_NAT=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NF_NAT_IPV4=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y

        # --- KernelSU ---
        CONFIG_KSU=y
        EOF

        ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out \
          arch/arm64/configs/surya_defconfig \
          docker_ksu.config

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LOCALVERSION="-Docker-KSU" \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git

        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=Surya-Docker-KernelSU-A16
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        device.name1=surya
        device.name2=karna
        '; }

        BLOCK=auto
        IS_SLOT_DEVICE=0
        RAMDISK_COMPRESSION=auto

        . tools/ak3-core.sh
        split_boot
        flash_boot
        flash_dtbo
        EOF

        cd AnyKernel3
        zip -r9 ../Surya-Docker-KernelSU.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-KernelSU
        path: Surya-Docker-KernelSU.zip
