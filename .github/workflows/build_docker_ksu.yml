name: Build Surya Kernel A16 (Docker + KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Setup KernelSU & Docker Configs
      run: |
        # 1. 集成最新 KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        DEFCONFIG="arch/arm64/configs/surya_defconfig"
        set_config() {
          sed -i "/$1/d" $DEFCONFIG
          echo "$1=$2" >> $DEFCONFIG
        }

        # --- KernelSU 增强配置 ---
        set_config "CONFIG_KSU" "y"
        set_config "CONFIG_KSU_LSM_SECURITY_HOOKS" "y"
        # 允许某些旧版 Hook 方式以兼容 Android 16
        set_config "CONFIG_KSU_ALLOWLIST_WORKAROUND" "y"

        # --- 补全 Docker 缺失的 Cgroup 控制器 ---
        set_config "CONFIG_CGROUP_PIDS" "y"
        set_config "CONFIG_CGROUP_FREEZER" "y"
        set_config "CONFIG_CGROUP_HUGETLB" "y"
        set_config "CONFIG_CGROUP_DEVICE" "y"
        set_config "CONFIG_CGROUP_CPUACCT" "y"
        set_config "CONFIG_CGROUP_BPF" "y"
        set_config "CONFIG_MEMCG" "y"
        set_config "CONFIG_MEMCG_SWAP" "y"
        set_config "CONFIG_MEMCG_SWAP_ENABLED" "y"
        set_config "CONFIG_CPU_CGROUP" "y"
        set_config "CONFIG_FAIR_GROUP_SCHED" "y"
        set_config "CONFIG_CFS_BANDWIDTH" "y"
        set_config "CONFIG_RT_GROUP_SCHED" "y"
        set_config "CONFIG_CPUSETS" "y"

        # --- 补全 Docker 缺失的网络配置 ---
        set_config "CONFIG_IP6_NF_NAT" "y"
        set_config "CONFIG_IP6_NF_TARGET_MASQUERADE" "y"
        set_config "CONFIG_IP_NF_TARGET_REDIRECT" "y"
        set_config "CONFIG_NETFILTER_XT_MATCH_IPVS" "y"
        set_config "CONFIG_IP_VS" "y"
        set_config "CONFIG_IP_VS_RR" "y"
        set_config "CONFIG_IP_VS_NFCT" "y"
        set_config "CONFIG_IP_VS_PROTO_TCP" "y"
        set_config "CONFIG_IP_VS_PROTO_UDP" "y"
        set_config "CONFIG_VXLAN" "y"
        set_config "CONFIG_MACVLAN" "y"
        set_config "CONFIG_IPVLAN" "y"
        set_config "CONFIG_BRIDGE_VLAN_FILTERING" "y"
        set_config "CONFIG_NET_L3_MASTER_DEV" "y"

        # --- 调试与兼容性 ---
        set_config "CONFIG_IKCONFIG" "y"
        set_config "CONFIG_IKCONFIG_PROC" "y"
        # 允许通过 cmdline 临时关闭 SELinux 强制模式 (以便测试 KSU)
        set_config "CONFIG_SECURITY_SELINUX_DEVELOP" "y"
        
    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 使用现代 LLVM 编译方式
        make O=out surya_defconfig
        make -j$(nproc --all) O=out \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz-dtb dtbo.img
    - name: Package with AnyKernel3
      run: |
        # 1. 克隆全新的 AnyKernel3
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        
        # 2. 拷贝内核产物
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        fi

        # 3. 【关键核心】直接重写 anykernel.sh，彻底抛弃 OMAP 模板
        cat <<EOF > AnyKernel3/anykernel.sh
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers

        properties() { '
        kernel.string=Docker-KSU-Surya-A16
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        # 设置 boot 分区为自动寻找
        BLOCK=auto;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        # 导入核心函数
        . tools/ak3-core.sh;

        # 刷入内核
        split_boot;
        flash_boot;

        # 如果存在 dtbo.img 则刷入
        flash_dtbo;
        EOF

        # 4. 最终检查：确保文件里绝对没有 omap 字符串
        echo "--- Final Check of anykernel.sh ---"
        if grep -q "omap" AnyKernel3/anykernel.sh; then
          echo "❌ ERROR: OMAP path still exists!"
          exit 1
        else
          echo "✅ SUCCESS: anykernel.sh is clean."
        fi

        # 5. 打包
        cd AnyKernel3
        zip -r9 ../Surya-Docker-KSU-Kernel-A16.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-KSU-Kernel-A16
        path: Surya-Docker-KSU-Kernel-A16.zip
