name: Build Surya Kernel A16 (Docker + KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Setup KernelSU & Docker Configs
      run: |
        # 1. 集成 KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        
        # 2. 预处理 defconfig：删除可能存在的冲突禁用项
        DEFCONFIG="arch/arm64/configs/surya_defconfig"
        sed -i '/CONFIG_PID_NS/d' $DEFCONFIG
        sed -i '/CONFIG_IPC_NS/d' $DEFCONFIG
        sed -i '/CONFIG_NAMESPACES/d' $DEFCONFIG
        sed -i '/CONFIG_NET_NS/d' $DEFCONFIG
        sed -i '/CONFIG_UTS_NS/d' $DEFCONFIG
        sed -i '/CONFIG_CGROUPS/d' $DEFCONFIG
        
        # 3. 追加 Docker 和 KernelSU 必需配置
        echo "" >> $DEFCONFIG
        cat <<EOF >> $DEFCONFIG
        # --- KernelSU ---
        CONFIG_KSU=y
        
        # --- 强制禁用 LTO ---
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        
        # --- Docker 强制性核心 (Must have) ---
        CONFIG_NAMESPACES=y
        CONFIG_NET_NS=y
        CONFIG_PID_NS=y
        CONFIG_IPC_NS=y
        CONFIG_UTS_NS=y
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y
        CONFIG_KEYS=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_USER_NS=y
        
        # --- Docker 网络 & 存储 ---
        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_NF_NAT=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_IP_NF_NAT=y
        CONFIG_IP_NF_TARGET_REDIRECT=y
        CONFIG_OVERLAY_FS=y
        
        # --- Android 16 增强稳定性 ---
        CONFIG_BPF=y
        CONFIG_BPF_SYSCALL=y
        CONFIG_NETFILTER_XT_MATCH_BPF=y
        CONFIG_CGROUP_BPF=y
        CONFIG_IKCONFIG=y
        CONFIG_IKCONFIG_PROC=y
        EOF

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 使用现代 LLVM 编译方式
        make O=out surya_defconfig
        make -j$(nproc --all) O=out \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git

        # 复制产物
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        cd AnyKernel3
        # 强制设置 AnyKernel3 参数
        sed -i 's/^block=.*/block=auto;/g' anykernel.sh
        sed -i 's/^do.devicecheck=.*/do.devicecheck=0;/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=Docker-KSU-Surya-A16/g' anykernel.sh
        
        # 针对 A16 的重要补充：如果 Recovery 比较新，尝试直接刷入
        zip -r9 ../Surya-Docker-KSU-Kernel-A16.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-KSU-Kernel-A16
        path: Surya-Docker-KSU-Kernel-A16.zip
