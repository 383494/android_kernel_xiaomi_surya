name: Build Surya Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Prepare Docker Config Fragment
      run: |
        # 创建一个独立的配置片段文件，列出所有 Docker 及其依赖项
        # 参考自 daoudeddy 和 ivonblog 的推荐配置
        cat <<EOF > docker.config
        # --- 基础 IPC 和 命名空间 (Docker 核心) ---
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y

        # --- Cgroups (资源控制) ---
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y
        CONFIG_MEMCG_SWAP=y
        CONFIG_BLK_CGROUP=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_BPF=y

        # --- 网络核心 (Bridge, VETH, Netfilter) ---
        CONFIG_NETFILTER=y
        CONFIG_NETFILTER_ADVANCED=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_VETH=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_NETFILTER_XT_MARK=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        CONFIG_IP_NF_NAT=y
        CONFIG_NF_NAT=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_MANGLE=y

        # --- 文件系统 ---
        CONFIG_OVERLAY_FS=y

        # --- 可选高级网络 (Macvlan/Ipvlan) ---
        CONFIG_MACVLAN=y
        CONFIG_IPVLAN=y
        CONFIG_VXLAN=y
        
        # --- 解决 Android 权限限制 ---
        # 允许常规用户组创建 socket，解决 "socket: permission denied"
        # 许多 NetHunter 内核会关闭此项
        CONFIG_ANDROID_PARANOID_NETWORK=n
        
        # --- 调试/验证支持 ---
        CONFIG_IKCONFIG=y
        CONFIG_IKCONFIG_PROC=y
        EOF

    - name: Configure and Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # 1. 生成基础配置
        make O=out surya_defconfig

        # 2. 准备 Docker 强制配置 (补全了 SYSVIPC)
        cat <<EOF > docker_forced.config
        # --- 核心依赖 (缺一不可) ---
        CONFIG_EXPERT=y
        CONFIG_EMBEDDED=n
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        
        # --- Cgroups ---
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_BPF=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y
        CONFIG_MEMCG_SWAP=y
        
        # --- Namespaces ---
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y
        
        # --- Network ---
        CONFIG_NETFILTER=y
        CONFIG_NETFILTER_ADVANCED=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_VETH=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        CONFIG_OVERLAY_FS=y
        CONFIG_MACVLAN=y
        CONFIG_IPVLAN=y
        CONFIG_VXLAN=y
        
        # --- Security / Misc ---
        CONFIG_ANDROID_PARANOID_NETWORK=n
        EOF

        # 3. 暴力追加配置
        echo "Appending Docker config to out/.config..."
        cat docker_forced.config >> out/.config

        # 4. 刷新依赖 (olddefconfig)
        make O=out LLVM=1 LLVM_IAS=1 olddefconfig

        # 5. 生死检查 (Life or Death Check)
        echo "=== FINAL CONFIG CHECK ==="
        
        # 检查 SYSVIPC (IPC_NS 的爹)
        if grep -q "CONFIG_SYSVIPC=y" out/.config; then
            echo "✅ CONFIG_SYSVIPC is ENABLED."
        else
            echo "❌ ERROR: CONFIG_SYSVIPC missing! This is why IPC_NS fails."
            exit 1
        fi

        # 检查 IPC_NS
        if grep -q "CONFIG_IPC_NS=y" out/.config; then
            echo "✅ CONFIG_IPC_NS is ENABLED."
        else
            echo "❌ ERROR: CONFIG_IPC_NS missing!"
            exit 1
        fi

        # 检查 PID_NS
        if grep -q "CONFIG_PID_NS=y" out/.config; then
            echo "✅ CONFIG_PID_NS is ENABLED."
        else
            echo "❌ ERROR: CONFIG_PID_NS missing!"
            exit 1
        fi
        
        # 检查 CGROUP_DEVICE
        if grep -q "CONFIG_CGROUP_DEVICE=y" out/.config; then
            echo "✅ CONFIG_CGROUP_DEVICE is ENABLED."
        else
            echo "❌ ERROR: CONFIG_CGROUP_DEVICE missing!"
            exit 1
        fi

        echo "All critical configs verified. Building..."

        # 6. 开始编译
        make -j$(nproc --all) O=out \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        # 生成 AnyKernel 脚本
        cat <<EOF > AnyKernel3/anykernel.sh
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=Docker-Surya-A16
        do.devicecheck=0
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        BLOCK=auto;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        . tools/ak3-core.sh;

        split_boot;
        flash_boot;
        flash_dtbo;
        EOF
        
        cd AnyKernel3
        zip -r9 ../Surya-Docker-Native.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-Native
        path: Surya-Docker-Native.zip
