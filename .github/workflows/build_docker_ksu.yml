name: Build Surya Kernel A16 (Docker + KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        
    - name: Setup Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang (Recommended for A14/A15/A16)
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Setup KernelSU & Docker Configs
      run: |
        # 1. Install KernelSU
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        
        # 2. Append Configs
        echo "" >> arch/arm64/configs/surya_defconfig
        
        cat <<EOF >> arch/arm64/configs/surya_defconfig
        # --- KernelSU ---
        CONFIG_KSU=y
        
        # --- 禁用 LTO (提高编译成功率，若源码强制要求 LTO 可删除这部分) ---
        CONFIG_LTO=n
        CONFIG_LTO_CLANG=n
        CONFIG_THINLTO=n
        
        # --- Docker General ---
        CONFIG_NAMESPACES=y
        CONFIG_NET_NS=y
        CONFIG_PID_NS=y
        CONFIG_IPC_NS=y
        CONFIG_UTS_NS=y
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y
        CONFIG_KEYS=y
        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_NF_NAT_IPV4=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_IP_NF_NAT=y
        CONFIG_NF_NAT=y
        CONFIG_POSIX_MQUEUE=y
        
        # --- Optional & Drivers ---
        CONFIG_USER_NS=y
        CONFIG_SECCOMP=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_MEMCG_SWAP=y
        CONFIG_MEMCG_SWAP_ENABLED=y
        CONFIG_BLK_CGROUP=y
        CONFIG_BLK_DEV_THROTTLING=y
        CONFIG_CGROUP_PERF=y
        CONFIG_CGROUP_HUGETLB=y
        CONFIG_NET_CLS_CGROUP=y
        CONFIG_CGROUP_NET_PRIO=y
        CONFIG_CFS_BANDWIDTH=y
        CONFIG_FAIR_GROUP_SCHED=y
        CONFIG_RT_GROUP_SCHED=y
        CONFIG_IP_NF_TARGET_REDIRECT=y
        CONFIG_IP_VS=y
        CONFIG_IP_VS_NFCT=y
        CONFIG_IP_VS_PROTO_TCP=y
        CONFIG_IP_VS_PROTO_UDP=y
        CONFIG_IP_VS_RR=y
        CONFIG_EXT4_FS=y
        CONFIG_EXT4_FS_POSIX_ACL=y
        CONFIG_EXT4_FS_SECURITY=y
        CONFIG_IPVLAN=y
        CONFIG_MACVLAN=y
        CONFIG_DUMMY=y
        CONFIG_VXLAN=y
        CONFIG_BRIDGE_VLAN_FILTERING=y
        CONFIG_BTRFS_FS=y
        CONFIG_BTRFS_FS_POSIX_ACL=y
        CONFIG_OVERLAY_FS=y
        CONFIG_WIREGUARD=y
        EOF

    - name: Build Kernel
      run: |
        # 设置 Neutron Clang 路径
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM=arm-linux-gnueabi-
        
        # 调试信息：打印 Clang 版本以确认
        clang --version
        
        # 生成配置
        make O=out surya_defconfig
        
        # 编译 Kernel 和 DTBO
        # 使用 llvm-ar, llvm-nm 等工具链，这对于 A16 很重要
        make -j$(nproc --all) O=out \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/kdrag0n/AnyKernel3.git
        
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        # 复制 dtbo.img (如果存在)
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        fi

        cd AnyKernel3
        # 禁用设备检查，防止型号识别错误
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=Docker-KSU-Surya-A16/g' anykernel.sh
        
        # 清理 git 文件夹
        rm -rf .git
        zip -r9 ../Surya-Docker-KSU-Kernel-A16.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-KSU-Kernel-A16
        path: Surya-Docker-KSU-Kernel-A16.zip
