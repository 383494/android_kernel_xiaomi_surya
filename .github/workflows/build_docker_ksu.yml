name: Build Surya Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Manual KernelSU Integration & Configs
      run: |
        # --- 1. 获取 KernelSU 源码 (修正目录结构) ---
        # 先下载到临时目录，再提取我们需要的部分
        # 这样可以确保 drivers/kernelsu/ksu.c 直接存在，而不是在子目录下
        rm -rf ksu_temp
        git clone --depth=1 https://github.com/tiann/KernelSU ksu_temp
        
        # 建立目录并移动核心代码
        rm -rf drivers/kernelsu
        mkdir -p drivers/kernelsu
        cp -r ksu_temp/kernel/* drivers/kernelsu/
        rm -rf ksu_temp

        # --- 2. 手动注册驱动 (不使用 setup.sh 以避免污染内核源码) ---
        # 这里的关键是：只让 KSU 作为模块参与编译，不修改 fs/exec.c 等原生文件
        # 从而彻底避开 "undefined symbol: ksu_input_hook" 等链接错误
        
        # 修改 drivers/Makefile
        if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
        fi
        
        # 修改 drivers/Kconfig
        if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        fi

        # --- 3. 针对 Android 4.14 内核的兼容性修复 (必做) ---
        
        # [Patch 1] ksu.c: 修复 4.14 没有 MODULE_IMPORT_NS 的报错
        sed -i '1i #include <linux/version.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 4, 0)\n#define MODULE_IMPORT_NS(ns)\n#endif' drivers/kernelsu/ksu.c

        # [Patch 2] allowlist.c: 修复 TWA_RESUME 未定义和 put_task_struct 头文件缺失
        sed -i '1i #include <linux/version.h>\n#include <linux/sched.h>\n#include <linux/sched/task.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 9, 0)\n#define TWA_RESUME 1\n#endif' drivers/kernelsu/allowlist.c

        # [Patch 3] sucompat.c: 修复 4.14 没有 linux/pgtable.h 的问题 (应为 linux/mm.h)
        sed -i 's|#include <linux/pgtable.h>|#include <linux/mm.h>|g' drivers/kernelsu/sucompat.c

        # --- 4. 生成 Docker + KSU 配置文件 ---
        # 注意：4.14 内核必须开启 KPROBES 才能让 KSU 正常工作
        cat <<EOF > docker_ksu.config
        # [KernelSU - Kprobe 模式]
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_OVERLAY_FS=y

        # [Docker 核心支持]
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        
        # [Cgroups 支持]
        CONFIG_CGROUPS=y
        CONFIG_MEMCG=y
        CONFIG_MEMCG_SWAP=y
        CONFIG_BLK_CGROUP=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CPUSETS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_BPF=y

        # [网络支持 - 修复 Bridge/IPVS missing]
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_VETH=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MARK=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_IP_VS=y
        CONFIG_IP_VS_RR=y
        CONFIG_IP_NF_NAT=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NF_NAT_IPV4=y

        # [解决 Android 特有网络限制]
        # CONFIG_ANDROID_PARANOID_NETWORK is not set

        # [禁用 LTO] 
        # 必须禁用，否则 KPROBES 找不到符号，KSU 会提示未安装
        # CONFIG_LTO_CLANG is not set
        # CONFIG_LTO_CLANG_THIN is not set
        EOF

        # --- 5. 合并配置 ---
        # 确保 out 目录存在
        rm -rf out
        mkdir -p out
        
        # 使用 merge_config.sh 将 docker_ksu.config 合并到默认配置中
        # 结果输出到 out/.config
        ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out arch/arm64/configs/surya_defconfig docker_ksu.config

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        
        # 进入 out 目录补全配置（填充那些未定义的默认值）
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
        
        # 验证 KSU 和 Namespace 是否真的开启了 (调试用)
        grep "CONFIG_KSU" out/.config
        grep "CONFIG_IPC_NS" out/.config
        
        # 开始编译
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1 \
          LOCALVERSION="-Docker-KSU-v1" \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        # 重写 anykernel.sh (使用精简版，避免 omap 错误和 /data 挂载错误)
        cat <<EOF > AnyKernel3/anykernel.sh
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=Docker-KSU-Surya-A16-Fixed
        do.devicecheck=0
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        BLOCK=auto;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        . tools/ak3-core.sh;

        split_boot;
        flash_boot;
        flash_dtbo;
        EOF
        
        cd AnyKernel3
        zip -r9 ../Surya-Docker-KSU-Final.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-KSU-Final
        path: Surya-Docker-KSU-Final.zip
