name: Build Surya Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: KernelSU Setup & Docker Configuration
      run: |
        # --- 1. KernelSU 安装 (保持你原来的方式) ---
        # 使用 setup.sh 自动 Patch 内核源码
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

        # --- 2. 核心修复：使用 merge_config.sh 注入 Docker 配置 ---
        # 我们不再修改 surya_defconfig，而是创建一个覆盖文件
        
        cat <<EOF > docker_overlay.config
        # ==============================================
        # Docker 核心依赖 (解决 missing 的关键)
        # ==============================================
        # 基础 IPC 设施 (Docker 必须)
        CONFIG_SYSVIPC=y
        CONFIG_POSIX_MQUEUE=y
        
        # Namespaces (Docker 容器隔离必须)
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y
        
        # Cgroups (资源限制必须)
        CONFIG_CGROUPS=y
        CONFIG_MEMCG=y
        CONFIG_MEMCG_SWAP=y
        CONFIG_BLK_CGROUP=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CPUSETS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_BPF=y

        # 网络虚拟化 (解决 veth/bridge missing)
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_VETH=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_IP_NF_NAT=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NF_NAT=y
        CONFIG_NF_NAT_IPV4=y
        
        # 文件系统
        CONFIG_OVERLAY_FS=y

        # ==============================================
        # Android 特有修复
        # ==============================================
        # 关闭这个选项，否则 Docker 容器内无法联网
        # CONFIG_ANDROID_PARANOID_NETWORK is not set
        
        # ==============================================
        # KernelSU 配置
        # ==============================================
        CONFIG_KSU=y
        # 开启 Kprobes 以增强兼容性
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        
        # 禁用 LTO (防止符号优化导致 KSU 失效)
        # CONFIG_LTO_CLANG is not set
        # CONFIG_LTO_CLANG_THIN is not set
        EOF

        # --- 3. 清理与合并 ---
        # 清理之前的构建残留
        make mrproper
        
        # 创建输出目录
        mkdir -p out
        
        # 【关键步骤】
        # 使用官方脚本将 surya_defconfig 和我们的 docker_overlay.config 合并
        # 结果直接生成到 out/.config，自动处理依赖关系
        export ARCH=arm64
        scripts/kconfig/merge_config.sh -m -O out arch/arm64/configs/surya_defconfig docker_overlay.config

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 此时 out/.config 已经由 merge_config.sh 生成好了
        # 我们只需要运行 olddefconfig 确认一下默认值
        make O=out LLVM=1 LLVM_IAS=1 olddefconfig
        
        # 检查一下配置是否真的进去了 (调试用)
        echo "Checking CONFIG_SYSVIPC..."
        grep "CONFIG_SYSVIPC" out/.config || true
        echo "Checking CONFIG_IPC_NS..."
        grep "CONFIG_IPC_NS" out/.config || true
        echo "Checking CONFIG_KSU..."
        grep "CONFIG_KSU" out/.config || true

        # 开始编译
        make -j$(nproc --all) O=out \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LOCALVERSION="-Docker-Fixed" \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        cat <<EOF > AnyKernel3/anykernel.sh
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=Docker-Surya-Fixed
        do.devicecheck=0
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        BLOCK=auto;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        . tools/ak3-core.sh;

        split_boot;
        flash_boot;
        flash_dtbo;
        EOF
        
        cd AnyKernel3
        zip -r9 ../Surya-Docker-Final.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-Final
        path: Surya-Docker-Final.zip
