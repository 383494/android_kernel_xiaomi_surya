name: Build Surya Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 python-is-python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Setup Neutron Clang
      run: |
        mkdir -p clang
        cd clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Manual KernelSU Integration & Configs
      run: |
        # --- 1. 手动集成 KernelSU (最稳妥的方式) ---
        # 移除旧的集成尝试（如果有）
        rm -rf drivers/kernelsu
        
        # 下载 KernelSU 源码 (使用 main 分支以支持最新 Android)
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 强制检查 drivers/Makefile，确保 obj-y 被添加
        # 有时候脚本因为格式问题会失败，这里手动兜底
        if ! grep -q "kernelsu" drivers/Makefile; then
            echo "Manually patching drivers/Makefile..."
            echo "obj-y += kernelsu/" >> drivers/Makefile
        fi
        
        # 强制检查 drivers/Kconfig
        if ! grep -q "kernelsu" drivers/Kconfig; then
            echo "Manually patching drivers/Kconfig..."
            # 在 endmenu 前插入 source
            sed -i "/endmenu/i source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        fi

        # --- 2. 注入配置 (解决 Docker 依赖地狱) ---
        DEFCONFIG="arch/arm64/configs/surya_defconfig"
        
        # 定义配置修改函数
        set_config() {
          # 先删除旧配置（防止重复或冲突）
          sed -i "/$1/d" $DEFCONFIG
          # 追加新配置
          echo "$1=$2" >> $DEFCONFIG
        }

        echo "Injecting Critical Configs..."

        # [基础依赖] 必须开启，否则后面的 IPC_NS 和 PID_NS 会失效！
        set_config "CONFIG_SYSVIPC" "y"
        set_config "CONFIG_NETFILTER_ADVANCED" "y"
        set_config "CONFIG_EXPERT" "y"

        # [KernelSU]
        set_config "CONFIG_KSU" "y"
        set_config "CONFIG_KSU_LSM_SECURITY_HOOKS" "y"
        set_config "CONFIG_LTO_CLANG" "n"  # 必须禁用 LTO，否则 KSU 符号被优化掉导致 Unsupported

        # [Docker Namespaces - Critical]
        set_config "CONFIG_NAMESPACES" "y"
        set_config "CONFIG_NET_NS" "y"
        set_config "CONFIG_PID_NS" "y"
        set_config "CONFIG_IPC_NS" "y"
        set_config "CONFIG_UTS_NS" "y"
        set_config "CONFIG_USER_NS" "y"
        set_config "CONFIG_POSIX_MQUEUE" "y"

        # [Cgroups - Critical]
        set_config "CONFIG_CGROUPS" "y"
        set_config "CONFIG_CGROUP_FREEZER" "y"
        set_config "CONFIG_CGROUP_PIDS" "y"
        set_config "CONFIG_CGROUP_DEVICE" "y"
        set_config "CONFIG_CPUSETS" "y"
        set_config "CONFIG_MEMCG" "y"
        set_config "CONFIG_MEMCG_SWAP" "y"
        set_config "CONFIG_BLK_CGROUP" "y"
        set_config "CONFIG_CGROUP_SCHED" "y"
        set_config "CONFIG_CGROUP_CPUACCT" "y"
        set_config "CONFIG_CGROUP_BPF" "y"

        # [Network - Critical]
        set_config "CONFIG_BRIDGE" "y"
        set_config "CONFIG_BRIDGE_NETFILTER" "y"
        set_config "CONFIG_VETH" "y"
        set_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE" "y"
        set_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK" "y"
        set_config "CONFIG_NETFILTER_XT_MATCH_IPVS" "y"
        set_config "CONFIG_IP_NF_TARGET_MASQUERADE" "y"
        set_config "CONFIG_IP6_NF_TARGET_MASQUERADE" "y"
        set_config "CONFIG_IP_NF_NAT" "y"
        set_config "CONFIG_NF_NAT" "y"
        set_config "CONFIG_OVERLAY_FS" "y"

        # [Docker Optional but Good]
        set_config "CONFIG_MACVLAN" "y"
        set_config "CONFIG_IPVLAN" "y"
        set_config "CONFIG_VXLAN" "y"
        
        # [Debugging]
        set_config "CONFIG_IKCONFIG" "y"
        set_config "CONFIG_IKCONFIG_PROC" "y"

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 生成 .config
        make O=out surya_defconfig
        
        # --- 3. 二次检查 (Double Check) ---
        # 有时候 defconfig 生成过程会根据依赖关系丢弃我们的配置
        # 这里我们在编译前直接检查最终生成的 out/.config
        # 如果发现 SYSVIPC 没开，再次强制开启，但这通常意味着 defconfig 修改成功了
        if ! grep -q "CONFIG_SYSVIPC=y" out/.config; then
            echo "WARNING: CONFIG_SYSVIPC was dropped! Forcing it in out/.config..."
            echo "CONFIG_SYSVIPC=y" >> out/.config
            # 重新生成以更新依赖
            make O=out olddefconfig
        fi

        # 开始编译
        make -j$(nproc --all) O=out \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz-dtb dtbo.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git
        
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        # 重写 anykernel.sh (使用精简版，避免 omap 错误和 /data 挂载错误)
        cat <<EOF > AnyKernel3/anykernel.sh
        # AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=Docker-KSU-Surya-A16-Fixed
        do.devicecheck=0
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=0
        '; }

        BLOCK=auto;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        . tools/ak3-core.sh;

        split_boot;
        flash_boot;
        flash_dtbo;
        EOF
        
        cd AnyKernel3
        zip -r9 ../Surya-Docker-KSU-Final.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-KSU-Final
        path: Surya-Docker-KSU-Final.zip
