name: Build Surya Kernel (Docker only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git bc bison flex libssl-dev make \
          libc6-dev-i386 libncurses5-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          curl zip unzip python3

    - name: Setup Neutron Clang
      run: |
        mkdir clang && cd clang
        curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
        chmod +x antman
        ./antman -S
        ./antman --patch=glibc

    - name: Kernel Config (Docker Only)
      run: |
        make mrproper
        mkdir -p out

        cat <<EOF > docker.config
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y

        CONFIG_CGROUPS=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y

        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_NETFILTER=y
        CONFIG_NF_NAT=y
        CONFIG_IP_NF_NAT=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y

        CONFIG_OVERLAY_FS=y

        # 明确禁用内核 Root
        # CONFIG_KSU is not set
        EOF

        ARCH=arm64 scripts/kconfig/merge_config.sh \
          -O out arch/arm64/configs/surya_defconfig docker.config

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

        make O=out ARCH=arm64 LLVM=1 olddefconfig

        make -j$(nproc) O=out \
          ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz-dtb dtbo.img

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git
        rm -rf AnyKernel3/.git

        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/

        cat <<EOF > AnyKernel3/anykernel.sh
        properties() { '
        kernel.string=Surya-Docker-Magisk
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        device.name1=surya
        device.name2=karna
        '; }

        BLOCK=auto
        IS_SLOT_DEVICE=0

        . tools/ak3-core.sh

        split_boot
        flash_boot
        flash_dtbo
        EOF

        cd AnyKernel3
        zip -r9 ../Surya-Docker-Magisk.zip *

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Surya-Docker-Magisk
        path: Surya-Docker-Magisk.zip
